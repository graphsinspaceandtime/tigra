name: Build docs page

on:
  push:
    paths:
      - "data/**/*.py"
      - "tigra/**/*.py"
      - .github/workflows/docs.yml
  workflow_dispatch:

env:
  CONDA_ENV_NAME: tigranew
  CONDA_ENV_FILE: environment.tigranew.yml
  LOGO_URL: https://tigraphs.pmf.uns.ac.rs/wp-content/uploads/2023/12/cropped-tigar-logo-final-3.png

jobs:
  build:
    name: Build docs page
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        name: Setup miniconda
        with:
          auto-activate-base: false
      - uses: actions/cache@v4
        name: Cache environment
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/miniconda3/envs/${{ env.CONDA_ENV_NAME }}
          key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles(env.CONDA_ENV_FILE) }}
        id: cache-conda
      - name: Create conda environment
        shell: bash -el {0}
        run: |
          if ! conda env list | grep -q ${{ env.CONDA_ENV_NAME }}
          then
            conda env create --name ${{ env.CONDA_ENV_NAME }} --file ${{ env.CONDA_ENV_FILE }}
          fi
      - name: Build docs
        working-directory: data
        shell: bash -el {0}
        run: |
          conda activate tigranew
          pdoc --logo "${{ env.LOGO_URL }}" --output-directory bank bank.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-bank
          path: docs/bank/
